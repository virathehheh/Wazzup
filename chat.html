
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazzup Chat</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="chat-page">

    <header class="chat-header">
    <a href="home.html" class="back-button">←</a>

    <div class="chat-avatar">U</div>

    <div class="chat-user-info">
        <h3 id="chatName">Wazzup User</h3>
        <p id="chatStatus">Connecting...</p>
    </div>

    <div class="call-buttons">
        <button id="voiceCallButton" type="button" title="Voice Call">📞</button>
        <button id="videoCallButton" type="button" title="Video Call">📹</button>
    </div>
</header>

    <main class="messages-area" id="messagesArea">
        <div class="empty-chat">
            <h3>Start a Conversation!</h3>
            <p>Say hello to your friend.</p>
        </div>
    </main>

   <footer class="message-footer">

   <button id="photoButton" type="button">📎</button>

<input
    type="file"
    id="photoInput"
    accept="image/*,video/mp4,video/webm,video/quicktime"
    multiple
    hidden
>

    <button id="voiceButton" type="button">🎙️</button>

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
    >

    <button id="sendButton" type="button">Send</button>

</footer>

    <script type="module" src="chat.js?v=6"></script>

</body>
</html>
