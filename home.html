<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazzup - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="home-header">
        <h1>WAZZ<span>UP</span></h1>
        <p>Your space. Your people.</p>
    </header>

    <div class="search-box">
        <input type="text" placeholder="Search people or chats...">
    </div>

    <section class="welcome">
        <h2>Welcome to Wazzup!</h2>
        <p>Start a conversation today.</p>
    </section>

    <section class="chat-section">
        <h3>Recent Conversations</h3>

        <div class="chat-item">
            <div class="avatar">A</div>
            <div class="chat-info">
                <h4>Alex</h4>
                <p>Hey! What's up?</p>
            </div>
            <span class="online-dot"></span>
        </div>

        <div class="chat-item">
            <div class="avatar">R</div>
            <div class="chat-info">
                <h4>Rahul</h4>
                <p>See you tomorrow!</p>
            </div>
        </div>

        <div class="chat-item">
            <div class="avatar">S</div>
            <div class="chat-info">
                <h4>Sarah</h4>
                <p>That's awesome!</p>
            </div>
        </div>
    </section>

    <nav class="bottom-nav">
        <a href="home.html">Home</a>
        <a href="#">Chats</a>
        <a href="#">Profile</a>
    </nav>

</body>
</html>
