
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Wazzup - Home</title>
    <link rel="stylesheet" href="style.css?v=5">

    <style>
        body.wazzup-home {
            background: #000 !important;
            color: #fff !important;
        }

        .app-container {
            background: #000 !important;
        }

        .top-bar {
            background: #000 !important;
        }

        .chat-item {
            background: #0b0b0b !important;
            color: #fff !important;
            border-bottom: 1px solid #202020;
        }

        .chat-info h4 { color: #fff !important; }
        .chat-info p { color: #999 !important; }

        .search-box {
            background: #151515 !important;
            border: 1px solid #292929;
        }

        .search-box input {
            color: white !important;
            background: transparent !important;
        }

        .bottom-nav {
            background: #080808 !important;
            border-top: 1px solid #252525;
        }

        .bottom-nav .nav-item {
            color: #999 !important;
        }

        .bottom-nav .nav-item.active {
            color: #20d879 !important;
        }

        .stories-section, .chat-section, .search-section {
            background: #000 !important;
        }

        .section-heading h2 {
            color: #fff !important;
        }

        .chat-subtitle, .coming-soon {
            color: #20d879 !important;
        }
    </style>
</head>

<body class="wazzup-home">

<main class="app-container">

    <header class="top-bar">
        <a href="home.html" class="brand">
            WAZZ<span>UP</span>
        </a>

        <div class="top-actions">
            <button class="icon-btn" type="button" aria-label="Menu">☰</button>
            <button class="icon-btn" type="button"
                aria-label="Search"
                onclick="document.getElementById('userSearch').focus()">
                ⌕
            </button>
        </div>
    </header>

    <section class="stories-section" id="stories">
        <div class="section-heading">
            <h2>Today's Stories</h2>
            <span class="coming-soon">NEW</span>
        </div>

        <div class="stories-list">
            <div class="story-item">
                <div class="story-avatar my-story"><span>+</span></div>
                <p>Your story</p>
            </div>

            <div class="story-item">
                <div class="story-avatar story-one">W</div>
                <p>Wazzup</p>
            </div>

            <div class="story-item">
                <div class="story-avatar story-two">F</div>
                <p>Friends</p>
            </div>

            <div class="story-item">
                <div class="story-avatar story-three">S</div>
                <p>Stories</p>
            </div>
        </div>
    </section>

    <section class="search-section">
        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                id="userSearch"
                placeholder="Search people or username..."
                autocomplete="off">
        </div>
    </section>

    <section class="chat-section" id="messages">
        <div class="section-heading">
            <h2>Messages</h2>
            <span class="chat-subtitle">People on Wazzup</span>
        </div>

        <div id="usersList">
            <p>Loading users...</p>
        </div>
    </section>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <span>⌂</span>
            <small>Home</small>
        </a>

        <a href="home.html#messages" class="nav-item">
            <span>▤</span>
            <small>Chats</small>
        </a>

        <a href="home.html#stories" class="nav-item">
            <span>◉</span>
            <small>Updates</small>
        </a>

        <a href="posts.html" class="nav-item">
            <span>▧</span>
            <small>Posts</small>
        </a>

        <a href="profile.html" class="nav-item">
            <span>◎</span>
            <small>Profile</small>
        </a>
    </nav>

</main>

<script type="module" src="home.js"></script>

</body>
</html>
