
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08120D">

    <title>Subhi AI - Wazzup</title>

    <link rel="stylesheet" href="style.css?v=6">

    <style>
        * {
            box-sizing: border-box;
        }

        body.subhi-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #08120D;
            color: white;
            font-family: Arial, sans-serif;
        }

        .subhi-app {
            height: 100%;
            max-width: 800px;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: #08120D;
        }

        .subhi-header {
            min-height: 68px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #10251A;
            border-bottom: 1px solid #244332;
        }

        .back-button {
            color: white;
            text-decoration: none;
            font-size: 27px;
            padding: 5px;
        }

        .subhi-avatar {
            width: 43px;
            height: 43px;
            border-radius: 15px;
            background: #20E878;
            color: #08120D;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .subhi-title {
            flex: 1;
        }

        .subhi-title h2 {
            margin: 0;
            font-size: 18px;
            color: #20E878;
        }

        .subhi-title p {
            margin: 4px 0 0;
            font-size: 11px;
            color: #9AB5A4;
        }

        .new-chat {
            background: #193D29;
            color: #20E878;
            border: 1px solid #276B43;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .subhi-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .welcome {
            text-align: center;
            margin: auto 0;
            padding: 20px 10px;
        }

        .welcome-icon {
            font-size: 55px;
            color: #20E878;
        }

        .welcome h1 {
            color: #20E878;
            font-size: 25px;
        }

        .welcome p {
            color: #9AB5A4;
            font-size: 14px;
            line-height: 1.6;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .ai-message {
            align-self: flex-start;
            background: #142B1D;
            border: 1px solid #254833;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
            background: #075E38;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .subhi-input-area {
            padding: 12px;
            background: #102019;
            border-top: 1px solid #244332;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 9px;
            background: #1A3022;
            border: 1px solid #31563D;
            border-radius: 25px;
            padding: 5px 7px 5px 15px;
        }

        .input-row textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 14px;
            padding: 10px 0;
            max-height: 100px;
            font-family: Arial, sans-serif;
        }

        .input-row textarea::placeholder {
            color: #91A899;
        }

        .send-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #20E878;
            color: #08120D;
            font-size: 19px;
            cursor: pointer;
        }

        .send-button:disabled {
            opacity: 0.5;
        }

        .disclaimer {
            text-align: center;
            color: #718777;
            font-size: 10px;
            margin: 9px 0 2px;
        }
    </style>
</head>

<body class="subhi-page">

<div class="subhi-app">

    <header class="subhi-header">

        <a href="home.html" class="back-button">‹</a>

        <div class="subhi-avatar">✦</div>

        <div class="subhi-title">
            <h2>Subhi AI</h2>
            <p>Wazzup AI Assistant</p>
        </div>

        <button class="new-chat" id="newChat">+ New</button>

    </header>

    <main class="subhi-messages" id="messages">

        <div class="welcome" id="welcome">
            <div class="welcome-icon">✦</div>

            <h1>Hey! I'm Subhi 👋</h1>

            <p>
                Welcome to my world!<br>
                Ask me questions, learn something new,
                or just have a conversation.
            </p>
        </div>

    </main>

    <footer class="subhi-input-area">

        <div class="input-row">

            <textarea
                id="userMessage"
                rows="1"
                placeholder="Message Subhi AI..."
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                aria-label="Send message">
                ➤
            </button>

        </div>

        <p class="disclaimer">
            Subhi AI can make mistakes. Verify important information.
        </p>

    </footer>

</div>

<script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("userMessage");
    const sendButton = document.getElementById("sendButton");
    const welcome = document.getElementById("welcome");
    const newChat = document.getElementById("newChat");

    function addMessage(text, type) {
        const message = document.createElement("div");
        message.className = "message " + type;
        message.textContent = text;
        messages.appendChild(message);
        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        if (welcome) {
            welcome.remove();
        }

        addMessage(text, "user-message");

        input.value = "";

        addMessage(
            "Hey! 👋 Main Subhi AI hoon. Mera chat interface ready hai! Abhi mera AI brain connect nahi hua hai. Woh hum agle step mein connect karenge. ❤️",
            "ai-message"
        );
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    newChat.addEventListener("click", function() {
        messages.innerHTML = `
            <div class="welcome" id="welcome">
                <div class="welcome-icon">✦</div>
                <h1>Hey! I'm Subhi 👋</h1>
                <p>Welcome back! What shall we talk about?</p>
            </div>
        `;
    });
</script>

</body>
</html>
