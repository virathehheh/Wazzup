
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- MOBILE ZOOM LOCK -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>Wazzup – Connect. Chat. Repeat.</title>

    <meta name="description" content="Wazzup is a messaging platform created by Pranjal Upadhyay to connect and chat with friends in real time.">

    <meta name="keywords" content="Wazzup, Wazzup Chat, messaging app, online chat, real time messaging">

    <meta name="author" content="Pranjal Upadhyay">
    <meta name="creator" content="Pranjal Upadhyay">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://virathehheh.github.io/Wazzup/">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#08120D">

    <meta property="og:title" content="Wazzup – Connect. Chat. Repeat.">
    <meta property="og:description" content="Wazzup is created by Pranjal Upadhyay. Connect with friends and chat in real time.">
    <meta property="og:image" content="https://virathehheh.github.io/Wazzup/logo.png">
    <meta property="og:url" content="https://virathehheh.github.io/Wazzup/">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="style.css">

    <!-- LOGIN PAGE ONLY CSS -->
    <style>
        .login-page {
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            margin: 0;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .login-page .logo {
            width: 150px;
            max-width: 42vw;
            height: auto;
            margin: 5px auto;
        }

        .login-page > p {
            margin: 4px 0 8px;
        }

        .login-page .login-box {
            width: calc(100% - 40px);
            max-width: 350px;
            box-sizing: border-box;
            margin: 8px auto;
            padding: 15px;
        }

        .login-page footer {
            margin: 5px auto 0 !important;
            padding: 0 5px 5px;
        }

        @media (max-height: 700px) {
            .login-page .logo {
                width: 115px;
            }

            .login-page .login-box {
                padding: 10px 15px;
                margin: 4px auto;
            }
        }
    </style>

    <!-- WEBSITE INFORMATION FOR SEARCH ENGINES -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Wazzup",
        "alternateName": "Wazzup Chat",
        "url": "https://virathehheh.github.io/Wazzup/",
        "creator": {
            "@type": "Person",
            "name": "Pranjal Upadhyay"
        },
        "author": {
            "@type": "Person",
            "name": "Pranjal Upadhyay"
        }
    }
    </script>

</head>

<body class="login-page">

    <img src="logo.png" alt="Wazzup Logo" class="logo">

    <p>Connect. Chat. Repeat.</p>

    <div class="login-box">

        <h2>Welcome Back!</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
        >

        <button id="loginButton">Login</button>

        <p>
            <a href="#" id="forgotPassword">
                Forgot Password?
            </a>
        </p>

        <p>New to Wazzup?</p>

        <button onclick="window.location.href='signup.html'">
            Create Account
        </button>

    </div>

    <!-- CREATOR INFORMATION -->
    <footer style="text-align: center; color: #a8b5ad; font-size: 12px;">
        Created by
        <strong style="color: #20e878;">Pranjal Upadhyay</strong>
    </footer>

    <!-- FIREBASE LOGIN -->
    <script type="module" src="script.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => {
                        console.log("Wazzup App Ready!");
                    })
                    .catch((error) => {
                        console.log("Service Worker Error:", error);
                    });
            });
        }
    </script>

</body>
</html>
